{{ define "main" }}
<div class="scroll-viewport" data-scroll>
  <div class="scroll-track">
    {{ partial "masthead.html" . }}

    {{ if eq .Section "posts" }}
      {{ partial "letter-sheet.html" (dict "page" . "withNav" true) }}
    {{ else }}
      {{ partial "page-sheet.html" . }}
    {{ end }}
  </div>
</div>
{{ end }}
