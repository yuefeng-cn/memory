      <h1 class="page-title">斋主简介</h1>
      <div class="letter-body">
        <p>青崖，不知何许人。少好读书，长而无所成。爱山川，喜笔墨，尤爱夜雨孤灯时，临数行古帖。性懒，不喜应酬；然遇故人，则谈至夜分不倦。</p>
<p>尝筑书斋于城南，窗前有梅一株，阶下有石数拳。春夏读书，秋冬煮酒。兴至则写数纸，兴尽则掷笔高卧。人问其号，曰：“青崖，取山色长青、崖石不语之意。”</p>
<p>斋中旧有联云：<strong>“一纸家书，抵得半生风雨；三杯薄酒，消磨万古黄昏。”</strong> 客来见此，多笑其迂。青崖亦笑，不复辩也。</p>

      </div>
